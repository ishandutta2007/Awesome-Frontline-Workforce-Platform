<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#312e81;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Animated Grid Nodes / Connectors -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="220" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="100" r="6" fill="#c084fc">
      <animate attributeName="r" values="4;9;4" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="230" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Connecting Lines -->
    <path d="M 150 80 Q 250 150 350 220" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 900 230 Q 960 165 1020 100" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Frontline Operational Graphics / Badges -->
  <g transform="translate(80, 100)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Pulse icon -->
    <path d="M 20 40 L 32 40 L 40 22 L 48 58 L 56 34 L 62 40 L 70 40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="stroke-dasharray" values="0,150;150,0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <g transform="translate(1040, 100)" filter="url(#glow)">
    <rect x="-40" y="0" width="80" height="80" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
    <!-- Mobile/Schedule icon -->
    <rect x="-22" y="16" width="44" height="48" rx="6" stroke="#c084fc" stroke-width="2.5" fill="none" />
    <line x1="-12" y1="28" x2="12" y2="28" stroke="#c084fc" stroke-width="2" />
    <line x1="-12" y1="38" x2="4" y2="38" stroke="#38bdf8" stroke-width="2" />
    <line x1="-12" y1="48" x2="8" y2="48" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Banner Title Text -->
  <text x="600" y="125" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="url(#text-grad)" filter="url(#glow)" letter-spacing="1">
    AWESOME FRONTLINE WORKFORCE
  </text>
  
  <text x="600" y="175" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" letter-spacing="4">
    PLATFORMS &amp; ORCHESTRATION
  </text>

  <!-- Subtitle pill -->
  <g transform="translate(600, 215)">
    <rect x="-240" y="0" width="480" height="36" rx="18" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="23" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">
      ⚡ SHIFT SCHEDULING • COMMUNICATION • TASK EXECUTION • AI WFM
    </text>
  </g>
</svg>
